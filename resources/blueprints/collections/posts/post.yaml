title: Post
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: Title
              required: true
          -
            handle: excerpt
            field:
              type: textarea
              display: Excerpt
              instructions: 'Short summary shown on the blog index and homepage. Falls back to the start of the content if blank.'
          -
            handle: categories
            field:
              type: terms
              display: Categories
              taxonomies:
                - categories
          -
            handle: content
            field:
              type: markdown
              display: Content

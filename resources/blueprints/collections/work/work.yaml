title: 'Work Entry'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              display: 'Company / Organization'
              required: true
          -
            handle: role
            field:
              type: text
              display: 'Title / Role'
              required: true
          -
            handle: employment_type
            field:
              type: select
              display: Type
              options:
                full_time: 'Full-time'
                contract: 'Contract / Consulting'
                founder: Founder
                volunteer: Volunteer
                academic: 'Academic / Practicum'
          -
            handle: start_date
            field:
              type: date
              display: 'Start Date'
              time_enabled: false
          -
            handle: date_approximate
            field:
              type: toggle
              display: 'Approximate Dates'
              instructions: 'When enabled, dates may display as "c. 1998" style in a future template pass.'
              default: false
          -
            handle: end_date
            field:
              type: date
              display: 'End Date (blank = current)'
              time_enabled: false
          -
            handle: is_current
            field:
              type: toggle
              display: 'Currently Here'
              default: false
          -
            handle: location
            field:
              type: text
              display: Location
          -
            handle: summary
            field:
              type: textarea
              display: 'Short Summary (1-2 sentences, for cards)'
              character_limit: 220
          -
            handle: content
            field:
              type: markdown
              display: 'Full Description'
          -
            handle: achievements
            field:
              type: replicator
              display: 'Key Achievements'
              sets:
                main:
                  display: Achievements
                  sets:
                    achievement:
                      display: Achievement
                      fields:
                        -
                          handle: text
                          field:
                            type: text
                            display: 'Achievement (lead with a metric where possible)'
          -
            handle: tech_stack
            field:
              type: terms
              display: 'Tech Stack'
              taxonomies:
                - tech_stack
          -
            handle: role_focus
            field:
              type: terms
              display: 'Role Focus'
              taxonomies:
                - role_focus
          -
            handle: industry
            field:
              type: terms
              display: Industry
              taxonomies:
                - industry
          -
            handle: logo
            field:
              type: assets
              display: 'Company / Org Logo'
              container: assets
              max_files: 1
          -
            handle: featured
            field:
              type: toggle
              display: 'Feature on Homepage'
              default: false
          -
            handle: awards
            field:
              type: replicator
              display: 'Awards / Recognition'
              sets:
                main:
                  display: Awards
                  sets:
                    award:
                      display: Award
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: 'Award Title'
                        -
                          handle: year
                          field:
                            type: text
                            display: Year
                        -
                          handle: amount
                          field:
                            type: text
                            display: 'Amount or Prize (if applicable)'
                        -
                          handle: source
                          field:
                            type: text
                            display: 'Awarding Body / Source (e.g. Polygon Studios, EthDenver)'
                        -
                          handle: source_url
                          field:
                            type: link
                            display: 'Link to source / proof (the org that gave the award)'
                        -
                          handle: recognition_type
                          field:
                            type: select
                            display: 'Recognition Type'
                            instructions: 'What kind of recognition is this? Defaults to standard award if unset.'
                            options:
                              award: 'Award / Grant'
                              feature: 'Feature / Curation'
                              archive: 'Archive / Preservation'
                            default: award
                        -
                          handle: sub_items
                          field:
                            type: replicator
                            display: Sub-items
                            sets:
                              main:
                                display: Sub-items
                                sets:
                                  recognition:
                                    display: Recognition
                                    fields:
                                      -
                                        handle: title
                                        field:
                                          type: text
                                          display: Title
                                      -
                                        handle: source
                                        field:
                                          type: text
                                          display: 'Awarding Body / Source'
                                      -
                                        handle: source_url
                                        field:
                                          type: link
                                          display: 'Link to source / proof'
                                      -
                                        handle: amount
                                        field:
                                          type: text
                                          display: 'Amount or Prize (if applicable)'
          -
            handle: related_projects
            field:
              type: entries
              display: 'Related Projects'
              collections:
                - projects
